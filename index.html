<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>旅遊計畫</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang TC', 'Microsoft JhengHei', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 40px 20px 60px;
        }

        .header {
            text-align: center;
            color: white;
            margin-bottom: 40px;
        }

        .header h1 {
            font-size: 28px;
            font-weight: 700;
            letter-spacing: 0.05em;
            margin-bottom: 8px;
        }

        .header p {
            font-size: 14px;
            opacity: 0.8;
        }

        .grid {
            max-width: 900px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 20px;
        }

        .card {
            background: white;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 8px 24px rgba(0,0,0,0.18);
            text-decoration: none;
            transition: transform 0.18s ease, box-shadow 0.18s ease;
            display: block;
        }

        .card:hover {
            transform: translateY(-4px);
            box-shadow: 0 14px 32px rgba(0,0,0,0.25);
        }

        .card-banner {
            height: 8px;
        }

        .card-body {
            padding: 22px 20px 20px;
        }

        .card-tag {
            font-size: 11px;
            font-weight: 600;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            opacity: 0.55;
            margin-bottom: 6px;
        }

        .card-title {
            font-size: 20px;
            font-weight: 700;
            color: #222;
            margin-bottom: 6px;
            line-height: 1.3;
        }

        .card-sub {
            font-size: 13px;
            color: #888;
            margin-bottom: 16px;
            line-height: 1.5;
        }

        .card-arrow {
            font-size: 13px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        /* Individual card themes */
        .bali .card-banner { background: linear-gradient(90deg, #11998e, #38ef7d); }
        .bali .card-tag { color: #11998e; }
        .bali .card-arrow { color: #11998e; }

        .daegu .card-banner { background: linear-gradient(90deg, #e53935, #1565c0); }
        .daegu .card-tag { color: #e53935; }
        .daegu .card-arrow { color: #e53935; }

        .ski-furano .card-banner { background: linear-gradient(90deg, #1a2744, #5b86e5); }
        .ski-furano .card-tag { color: #3a5fc5; }
        .ski-furano .card-arrow { color: #3a5fc5; }

        .furano-villa .card-banner { background: linear-gradient(90deg, #667eea, #764ba2); }
        .furano-villa .card-tag { color: #667eea; }
        .furano-villa .card-arrow { color: #667eea; }

        @media (max-width: 600px) {
            .header h1 { font-size: 22px; }
            body { padding: 28px 16px 48px; }
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>旅遊計畫</h1>
        <p>選擇一個目的地</p>
    </div>

    <div class="grid">

        <a href="bali/index.html" class="card bali">
            <div class="card-banner"></div>
            <div class="card-body">
                <div class="card-tag">Bali · 2026</div>
                <div class="card-title">峇里島</div>
                <div class="card-sub">行程規劃・景點・美食・住宿</div>
                <div class="card-arrow">查看行程 →</div>
            </div>
        </a>

        <a href="daegu/index.html" class="card daegu">
            <div class="card-banner"></div>
            <div class="card-body">
                <div class="card-tag">Korea · 2026 · 6D5N</div>
                <div class="card-title">大邱 × 釜山</div>
                <div class="card-sub">六天五夜・大邱3夜・釜山2夜</div>
                <div class="card-arrow">查看行程 →</div>
            </div>
        </a>

        <a href="ski-furano/index.html" class="card ski-furano">
            <div class="card-banner"></div>
            <div class="card-body">
                <div class="card-tag">Hokkaido · Furano · Winter</div>
                <div class="card-title">富良野滑雪</div>
                <div class="card-sub">行程規劃・費用估算・住宿選擇</div>
                <div class="card-arrow">查看行程 →</div>
            </div>
        </a>

        <a href="furano-villa/index.html" class="card furano-villa">
            <div class="card-banner"></div>
            <div class="card-body">
                <div class="card-tag">Furano · Villa · 9人</div>
                <div class="card-title">Villa 費用分攤</div>
                <div class="card-sub">Furano HANASAKA House・平面圖・每晚明細</div>
                <div class="card-arrow">查看分攤 →</div>
            </div>
        </a>

    </div>
</body>
</html>
